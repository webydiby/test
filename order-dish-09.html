<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>빙샌드 주문 어플리케이션</title>
  <link rel="stylesheet" href="style/style.css">
  <style>
    section:first-of-type {
      box-shadow: var(--shadow-bottom);
      
      img {
        width: 50%;
        max-width: 20em;
        border-radius: var(--radius);
      }

      p {
        width: 75%;
        text-align: center;
      }
    }
    
    .modal {
      --transition: transform;
      --duration: 150ms;

      .modal-contents {
        transform: translateY(100%);
        width: 100%;
        margin-top: auto;
        border-radius: var(--radius-2) var(--radius-2) 0 0;
        box-shadow: var(--shadow-top);
  
        .modal-on & {
          transform: none;
        }
  
        .order-component {
          padding: 0!important;
          margin-bottom: var(--spacingY-1)!important;
          box-shadow: none!important;
        }
      }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="screen">
      <header id="header" data-title="주문하기" data-prev-page="order-dish.html"></header>
  
      <div id="contents" class="bg-orange">
        <section class="bg-white">
          <article id="about-dish-09">
            <img>
            <p class="dish-kr title"></p>
            <p class="dish-en"></p>
            <p class="dish-description c-gray fz-small"></p>
          </article>
        </section>
    
        <section class="c-white">
          <article>
            <div class="box">
              <p class="title">함께하면 좋은 메뉴</p>
            </div>
            <div class="menu-component" data-menu-id="side-01"></div>
            <div class="menu-component" data-menu-id="side-02"></div>
            <div class="menu-component" data-menu-id="side-03"></div>
          </article>
          <button class="add-cart-btn open-modal-btn primary-btn w-100p">장바구니 담기</button>
        </section>
        
      </div>
      
      <div class="modal">
        <div class="modal-contents">
          <div class="order-component" data-order-id="current"></div>
          <p>제품을 장바구니에 담았어요</p>
          <a href="order-cart.html" class="primary-btn w-100p">장바구니 보기</a>
        </div>
      </div>
      
      <nav id="bnb" data-current-category="order"></nav>
    </div>
  </div>
  <script src="script/data.js"></script>
  <script src="script/component.js"></script>
  <script src="script/script.js"></script>
</body>
</html>
