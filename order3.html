<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>빙샌드 주문 어플리케이션</title>
  <link rel="stylesheet" href="style/style.css">
  <style>
    section:first-of-type {
      box-shadow: var(--shadow-bottom);
      
      img {
        width: 50%;
        max-width: 20em;
      }

      p {
        width: 75%;
        text-align: center;
      }
    }

    #receipt {
      left: 0;
      top: 100%;
      transform: translateY(calc(var(--footer-height) * -1));
      width: 100%;
      border-radius: var(--radius-2) var(--radius-2) 0 0;
      box-shadow: var(--shadow-top);
      transition: transform var(--duration) ease-in-out, visibility 0s var(--visibility-duration, var(--duration));
      
      .modal-on & {
        --visibility-duration: 0s;
        transform: translateY(calc((100% + var(--footer-height)) * -1));
      }

      .component {
        padding: 0!important;
        margin-bottom: var(--spacingY-1)!important;
        box-shadow: none!important;
      }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <header id="header" data-title="주문하기" data-prev-page="order2.html"></header>

    <div id="contents" class="bg-orange">
      <section class="bg-white">
        <article>
          <img src="img/dish/dish-01.png">
          <p class="title">클래식 햄치즈 샌드위치</p>
          <p>Classic Ham and Cheese Sandwich</p>
          <p class="c-gray fz-small">부드러운 식빵 사이에 햄과 치즈를 넣은 전통적인 샌드위치로, 간편하게 즐길 수 있는 메뉴입니다.</p>
        </article>
      </section>
  
      <section class="c-white">
        <article>
          <div class="box">
            <p class="title">함께하면 좋은 메뉴</p>
          </div>
          <div class="component" data-menu-id="side-01"></div>
          <div class="component" data-menu-id="side-02"></div>
          <div class="component" data-menu-id="side-03"></div>
        </article>
        <button class="primary-btn w-100p open-modal-btn">장바구니 담기</button>
      </section>
      
      <div id="receipt" class="modal">
        <div class="component" data-order-id="order-01"></div>
        <p>제품을 장바구니에 담았어요</p>
        <a href="cart2.html" class="primary-btn w-100p">장바구니 보기</a>
      </div>
    </div>
    
    <footer id="footer" data-current-category="order"></footer>
  </div>
  <script src="script/data.js"></script>
  <script src="script/component.js"></script>
  <script src="script/script.js"></script>
</body>
</html>
